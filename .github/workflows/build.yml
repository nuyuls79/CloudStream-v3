name: Build APK Release

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Fix Android string format errors
        run: |
          find app/src/main/res -name "*.xml" -type f -print0 | while IFS= read -r -d '' file; do
            sed -i 's/%s %s/%1$s %2$s/g' "$file"
            sed -i 's/%s -> %s/%1$s -> %2$s/g' "$file"
            sed -i 's/%s Ep %d/%1$s Ep %2$d/g' "$file"
            sed -i 's/%dh %dm/%1$dh %2$dm/g' "$file"
            sed -i 's/%dd %dh %dm/%1$dd %2$dh %3$dm/g' "$file"
          done

      - name: Create debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug, O=Android, C=US"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudStream-APK
          path: app/build/outputs/apk/**/*.apk

      - name: Upload build logs (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ~/.gradle/daemon/*/daemon-*.out.log
            app/build/reports/**/*
