name: Build App

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 8

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Gradle assemble (test)
        path: app/build/outputs/apk/**/app-*.apk
        run: ./gradlew tasks
