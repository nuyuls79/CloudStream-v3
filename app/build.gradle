apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'kotlin-parcelize'

def tmpFilePath = System.getProperty("user.home") + "/work/_temp/keystore/"
def allFilesFromDir = new File(tmpFilePath).listFiles()
def prereleaseStoreFile = null
if (allFilesFromDir != null && allFilesFromDir.length > 0) {
    prereleaseStoreFile = allFilesFromDir[0]
}

android {
    compileSdk 33  // gunakan 'compileSdk' bukan 'compileSdkVersion' (modern)

    buildFeatures {
        viewBinding true
    }

    defaultConfig {
        applicationId "foss.jacekun.cloudstream3xxx"
        minSdk 21
        targetSdk 33  // naikkan dari 28 ke 33 agar sejajar dengan compileSdk
        multiDexEnabled true

        versionCode 1607
        versionName "3.0.1"

        vectorDrawables.useSupportLibrary = true

        resValue "string", "app_version", versionName

        buildConfigField(
            "String",
            "BUILDDATE",
            "\"${new Date().format("yyyy-MM-dd HH:mm")}\""
        )

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        debug {}
        release {
            if (prereleaseStoreFile != null) {
                storeFile file(prereleaseStoreFile)
                storePassword System.getenv("SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("SIGNING_KEY_ALIAS")
                keyPassword System.getenv("SIGNING_KEY_PASSWORD")
            } else {
                storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
        prerelease {
            applicationIdSuffix ".prerelease"
            versionNameSuffix "-PRE"
            buildConfigField "boolean", "BETA", "true"
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-DEBUG"
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    // Hindari masalah duplicate class dari library yang bentrok
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

kapt {
    correctErrorTypes true
}

// ========== KONFIGURASI UNTUK MEMAKSA VERSI RHINO ==========
configurations.all {
    resolutionStrategy {
        force 'org.mozilla:rhino:1.7.14'
        exclude group: 'org.mozilla', module: 'rhino'
    }
}
// ============================================================

dependencies {
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'com.google.android.material:material:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.preference:preference-ktx:1.2.0'

    implementation 'androidx.multidex:multidex:2.0.1'
    implementation "androidx.tvprovider:tvprovider:1.0.0"

    implementation 'ch.acra:acra-core:5.9.3'
    implementation 'ch.acra:acra-http:5.9.3'

    implementation "com.fasterxml.jackson.module:jackson-module-kotlin:2.13.1"
    implementation "com.fasterxml.jackson.core:jackson-databind:2.13.1"

    implementation 'org.jsoup:jsoup:1.15.3'

    implementation 'com.squareup.okhttp3:okhttp:4.9.3'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.3'
    implementation 'com.squareup.okhttp3:okhttp-dnsoverhttps:4.9.3'

    // NewPipeExtractor - Versi terbaru yang tersedia di JitPack
    implementation 'com.github.teamnewpipe:NewPipeExtractor:v0.26.0'

    // Rhino - Versi stabil 1.7.14 yang kompatibel dengan D8
    implementation 'org.mozilla:rhino:1.7.14'

    implementation 'com.google.android.gms:play-services-cast-framework:21.3.0'

    implementation 'org.conscrypt:conscrypt-android:2.5.2'

    implementation 'com.google.android.exoplayer:exoplayer:2.18.1'
    implementation 'com.google.android.exoplayer:extension-okhttp:2.18.1'
    implementation 'com.google.android.exoplayer:extension-mediasession:2.18.1'

    implementation 'com.github.bumptech.glide:glide:4.14.2'
    kapt 'com.github.bumptech.glide:compiler:4.14.2'

    implementation 'jp.wasabeef:glide-transformations:4.3.0'
    implementation 'com.facebook.shimmer:shimmer:0.5.0'

    implementation 'com.jaredrummler:colorpicker:1.1.0'
    implementation 'com.github.albfernandez:juniversalchardet:2.4.0'

    implementation "com.github.tachiyomiorg:unifile:17bec43"
    implementation "com.uwetrottmann.tmdb2:tmdb-java:2.6.0"

    implementation "androidx.work:work-runtime:2.7.1"
    implementation "androidx.work:work-runtime-ktx:2.7.1"

    implementation "androidx.navigation:navigation-fragment:2.5.3"
    implementation "androidx.navigation:navigation-ui:2.5.3"

    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:1.2.2"

    // ========== TAMBAHAN DEPENDENSI YANG DIPERLUKAN ==========
    // Nicehttp (library internal CloudStream) - jika tersedia sebagai submodule
    // Jika tidak, coba dari Maven (ganti versi dengan yang sesuai)
    // implementation 'com.lagradost:nicehttp:1.0.0'

    // khttp - untuk permintaan HTTP sederhana (opsional, jika kode masih menggunakannya)
    implementation 'khttp:khttp:1.0.0'

    // JavaScript engine (Rhino sudah ada, tapi pastikan tidak bentrok)
    // Tidak perlu tambahan lagi
}