# Project-wide Gradle settings.

# JVM memory settings (important for CI and Kotlin dexing)
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8

# Disable Gradle daemon for CI environments
org.gradle.daemon=false

# Enable parallel build for faster compilation
org.gradle.parallel=true

# Disable caching in CI to avoid corrupted cache problems
org.gradle.caching=false

# AndroidX configuration
android.useAndroidX=true
android.enableJetifier=true

# Kotlin configuration
kotlin.code.style=official
kotlin.incremental=false
kotlin.daemon.jvm.options=-Xmx2048m
